<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Verhindert doppelte Scrollbalken auf der Hauptseite */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Fixiert den Header oben */
        header {
            flex-shrink: 0;
        }

        /* Container für das PDF nutzt den gesamten restlichen Platz */
        .pdf-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="nav-logo">Noël Joan</a>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="index.html#about" class="nav-link">About</a></li>
                    <li><a href="index.html#experience" class="nav-link">Experience</a></li>
                    <li><a href="projects.html" class="nav-link">Projects</a></li>
                    <li><a href="index.html#skills" class="nav-link">Skills</a></li>
                    <li><a href="index.html#contact" class="nav-link">Contact</a></li>
                </ul>
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </nav>
    </header>

    <!-- PDF-Bereich unterhalb des Menüs -->
    <div class="pdf-container">
        <iframe src="resume.pdf" class="pdf-viewer">
            Ihr Browser unterstützt die Anzeige von PDFs nicht. 
            <a href="resume.pdf">PDF herunterladen</a>.
        </iframe>
    </div>
</body>
</html>
